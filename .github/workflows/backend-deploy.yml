name: Backend Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "docker/**"
      - "render.yaml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: prakitdas018

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate backend build
        run: npm run build --prefix backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-api:${{ github.sha }}

      - name: Build and push executor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.executor
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-executor:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-executor:${{ github.sha }}

      - name: Build and push Node runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.node
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-node-runner:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-node-runner:${{ github.sha }}

      - name: Build and push Python runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.python
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-python-runner:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-python-runner:${{ github.sha }}

      - name: Build and push C/C++ runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpp
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-cpp-runner:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-cpp-runner:${{ github.sha }}

      - name: Build and push Java runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.java
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-java-runner:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/codesight-java-runner:${{ github.sha }}

      - name: Trigger Render deployment
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
