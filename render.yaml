services:
  - type: web
    name: codesight-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: .
    buildCommand: npm install && npm run build --prefix backend
    startCommand: npm run start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: TRUST_PROXY
        value: true
      - key: EXECUTOR_MODE
        value: local
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 60
      - key: LOG_LEVEL
        value: info
