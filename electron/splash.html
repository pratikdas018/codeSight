<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSight</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Geist", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: transparent;
      }

      .shell {
        width: 100%;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background:
          radial-gradient(circle at top left, rgba(0, 255, 65, 0.18), transparent 24%),
          radial-gradient(circle at 86% 18%, rgba(114, 255, 112, 0.08), transparent 22%),
          linear-gradient(180deg, rgba(9, 12, 9, 0.98), rgba(5, 6, 5, 0.98));
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 18px;
        overflow: hidden;
      }

      .titlebar {
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 0 0 16px;
        -webkit-app-region: drag;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(11, 14, 11, 0.45);
      }

      .titlebar__label {
        color: rgba(164, 185, 166, 0.72);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .window-controls {
        display: flex;
        align-items: stretch;
        -webkit-app-region: no-drag;
      }

      .window-button {
        width: 46px;
        height: 42px;
        border: 0;
        background: transparent;
        color: rgba(232, 255, 233, 0.86);
        font-size: 15px;
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease;
      }

      .window-button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .window-button--close:hover {
        background: #e11d48;
        color: white;
      }

      .content {
        display: grid;
        place-items: center;
        padding: 0 18px 18px;
      }

      .panel {
        width: 320px;
        padding: 28px 24px;
        border-radius: 18px;
        background: rgba(15, 18, 15, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .mark {
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(114, 255, 112, 0.16);
        background:
          radial-gradient(circle at 28% 26%, rgba(0, 255, 65, 0.2), transparent 36%),
          linear-gradient(145deg, #0f1710 0%, #060806 100%);
        box-shadow: 0 0 32px rgba(0, 255, 65, 0.08);
      }

      .mark svg {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
      }

      .brand {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.05em;
        color: #ebffe2;
      }

      .eyebrow {
        margin-top: 4px;
        color: #6f8a71;
        font-size: 10px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }

      .copy {
        margin-top: 10px;
        color: rgba(215, 226, 215, 0.78);
        font-size: 14px;
        line-height: 1.6;
      }

      .loader {
        margin-top: 18px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }

      .loader::after {
        content: "";
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #d9ffe2, #72ff70, #00e639);
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="titlebar">
        <div class="titlebar__label">CodeSight Desktop</div>
        <div class="window-controls">
          <button id="minimize" class="window-button" type="button" aria-label="Minimize">
            &#9472;
          </button>
          <button id="maximize" class="window-button" type="button" aria-label="Maximize or restore">
            &#9723;
          </button>
          <button id="close" class="window-button window-button--close" type="button" aria-label="Close">
            &#10005;
          </button>
        </div>
      </div>
      <div class="content">
        <div class="panel">
          <div class="brand-row">
            <div class="mark" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <defs>
                  <linearGradient id="codesight-mark" x1="0%" x2="100%" y1="0%" y2="100%">
                    <stop offset="0%" stop-color="#d9ffe2"></stop>
                    <stop offset="55%" stop-color="#72ff70"></stop>
                    <stop offset="100%" stop-color="#00e639"></stop>
                  </linearGradient>
                </defs>
                <path
                  d="M18 16.5h17.5c6 0 9.5 3.2 9.5 8 0 2.6-1.2 4.7-3.4 6.1 3.2 1.5 5.1 4.2 5.1 7.9 0 6.1-4.6 10-12 10H18z"
                  fill="none"
                  stroke="url(#codesight-mark)"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="4.5"
                ></path>
                <path
                  d="M18 31h17"
                  fill="none"
                  stroke="url(#codesight-mark)"
                  stroke-linecap="round"
                  stroke-width="4.5"
                ></path>
                <path
                  d="M39.5 18 49 8.5"
                  fill="none"
                  stroke="#d9ffe2"
                  stroke-linecap="round"
                  stroke-width="3"
                ></path>
                <circle cx="49.5" cy="8.5" r="3.5" fill="#72ff70"></circle>
              </svg>
            </div>
            <div>
              <div class="brand">CodeSight</div>
              <div class="eyebrow">Visual Debugging Workspace</div>
            </div>
          </div>
          <div class="copy">
            Preparing the workbench, editor, and runtime so the desktop app opens ready to code.
          </div>
          <div class="loader"></div>
        </div>
      </div>
    </div>
    <script>
      const minimizeButton = document.getElementById("minimize");
      const maximizeButton = document.getElementById("maximize");
      const closeButton = document.getElementById("close");

      const updateMaximizeButton = async () => {
        if (!window.electronAPI?.isWindowMaximized) {
          return;
        }

        const isMaximized = await window.electronAPI.isWindowMaximized();
        maximizeButton.textContent = isMaximized ? "\u2752" : "\u25A1";
        maximizeButton.setAttribute(
          "aria-label",
          isMaximized ? "Restore window" : "Maximize window",
        );
      };

      minimizeButton?.addEventListener("click", () => {
        window.electronAPI?.minimizeWindow?.();
      });

      maximizeButton?.addEventListener("click", async () => {
        await window.electronAPI?.toggleMaximizeWindow?.();
        void updateMaximizeButton();
      });

      closeButton?.addEventListener("click", () => {
        window.electronAPI?.closeWindow?.();
      });

      void updateMaximizeButton();
    </script>
  </body>
</html>
