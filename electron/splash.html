<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSight</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: transparent;
      }

      .shell {
        width: 100%;
        height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(34, 211, 238, 0.2), transparent 24%),
          radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.22), transparent 28%),
          rgba(11, 14, 20, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        overflow: hidden;
      }

      .panel {
        width: 300px;
        padding: 28px 24px;
        border-radius: 12px;
        background: rgba(21, 25, 33, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }

      .brand {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
        background: linear-gradient(90deg, #22d3ee, #6366f1);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .copy {
        margin-top: 10px;
        color: rgba(225, 226, 235, 0.82);
        font-size: 14px;
        line-height: 1.6;
      }

      .loader {
        margin-top: 18px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }

      .loader::after {
        content: "";
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22d3ee, #6366f1);
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="panel">
        <div class="brand">CodeSight</div>
        <div class="copy">
          Preparing the workbench, editor, and runtime so the desktop app opens ready to code.
        </div>
        <div class="loader"></div>
      </div>
    </div>
  </body>
</html>
