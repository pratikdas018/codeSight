<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSight</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: transparent;
      }

      .shell {
        width: 100%;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background:
          radial-gradient(circle at top left, rgba(34, 211, 238, 0.2), transparent 24%),
          radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.22), transparent 28%),
          rgba(11, 14, 20, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        overflow: hidden;
      }

      .titlebar {
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 0 0 16px;
        -webkit-app-region: drag;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(11, 14, 20, 0.35);
      }

      .titlebar__label {
        color: rgba(225, 226, 235, 0.72);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .window-controls {
        display: flex;
        align-items: stretch;
        -webkit-app-region: no-drag;
      }

      .window-button {
        width: 46px;
        height: 42px;
        border: 0;
        background: transparent;
        color: rgba(225, 226, 235, 0.86);
        font-size: 15px;
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease;
      }

      .window-button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .window-button--close:hover {
        background: #e11d48;
        color: white;
      }

      .content {
        display: grid;
        place-items: center;
        padding: 0 18px 18px;
      }

      .panel {
        width: 300px;
        padding: 28px 24px;
        border-radius: 12px;
        background: rgba(21, 25, 33, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }

      .brand {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
        background: linear-gradient(90deg, #22d3ee, #6366f1);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .copy {
        margin-top: 10px;
        color: rgba(225, 226, 235, 0.82);
        font-size: 14px;
        line-height: 1.6;
      }

      .loader {
        margin-top: 18px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }

      .loader::after {
        content: "";
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22d3ee, #6366f1);
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="titlebar">
        <div class="titlebar__label">CodeSight Desktop</div>
        <div class="window-controls">
          <button id="minimize" class="window-button" type="button" aria-label="Minimize">
            &#9472;
          </button>
          <button id="maximize" class="window-button" type="button" aria-label="Maximize or restore">
            &#9723;
          </button>
          <button id="close" class="window-button window-button--close" type="button" aria-label="Close">
            &#10005;
          </button>
        </div>
      </div>
      <div class="content">
        <div class="panel">
          <div class="brand">CodeSight</div>
          <div class="copy">
            Preparing the workbench, editor, and runtime so the desktop app opens ready to code.
          </div>
          <div class="loader"></div>
        </div>
      </div>
    </div>
    <script>
      const minimizeButton = document.getElementById("minimize");
      const maximizeButton = document.getElementById("maximize");
      const closeButton = document.getElementById("close");

      const updateMaximizeButton = async () => {
        if (!window.electronAPI?.isWindowMaximized) {
          return;
        }

        const isMaximized = await window.electronAPI.isWindowMaximized();
        maximizeButton.textContent = isMaximized ? "\u2752" : "\u25A1";
        maximizeButton.setAttribute(
          "aria-label",
          isMaximized ? "Restore window" : "Maximize window",
        );
      };

      minimizeButton?.addEventListener("click", () => {
        window.electronAPI?.minimizeWindow?.();
      });

      maximizeButton?.addEventListener("click", async () => {
        await window.electronAPI?.toggleMaximizeWindow?.();
        void updateMaximizeButton();
      });

      closeButton?.addEventListener("click", () => {
        window.electronAPI?.closeWindow?.();
      });

      void updateMaximizeButton();
    </script>
  </body>
</html>
